name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35,build-tools;35.0.0'

      - name: Unzip project
        run: unzip -o BibaiProductCounter-Android-project.zip

      - name: Check project files
        run: |
          ls -la bibai-android-app
          ls -la bibai-android-app/gradle/wrapper || true

      - name: Build APK
        working-directory: bibai-android-app
        run: gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bibai-product-counter-apk
          path: bibai-android-app/app/build/outputs/apk/debug/*.apk
