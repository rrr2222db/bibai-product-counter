name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Inspect ZIP
        run: |
          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile("BibaiProductCounter-Android-project.zip") as z:
              for info in z.infolist():
                  name = info.filename
                  print(repr(name))
                  print("Path length:", len(name))
          PY

      - name: Unpack project
        run: |
          python3 - <<'PY'
          import zipfile
          import os

          zip_name = "BibaiProductCounter-Android-project.zip"

          with zipfile.ZipFile(zip_name) as z:
              for info in z.infolist():
                  name = info.filename

                  # 異常に長いファイル名の説明用TXTだけを除外
                  if (
                      name.startswith("bibai-android-app/")
                      and name.lower().endswith(".txt")
                      and len(name) > 100
                  ):
                      print("除外:", repr(name))
                      continue

                  z.extract(info, ".")

          print("ZIP展開完了")
          PY

      - name: Build APK
        working-directory: bibai-android-app
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bibai-product-counter-apk
          path: bibai-android-app/app/build/outputs/apk/debug/*.apk
