name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y gradle

      - name: Unpack project
        run: unzip -o BibaiProductCounter-Android-project.zip

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Build APK
        working-directory: bibai-android-app
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: bibai-product-counter-apk
          path: bibai-android-app/app/build/outputs/apk/debug/*.apk
