name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name:       - name: Inspect ZIP
        run: |
          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile("BibaiProductCounter-Android-project.zip") as z:
              for info in z.infolist():
                  name = info.filename
                  try:
                      name.encode("utf-8")
                      print("OK:", repr(name))
                  except UnicodeEncodeError:
                      print("INVALID:", repr(name))
          PY

      - name: Build APK
        working-directory: bibai-android-app
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bibai-product-counter-apk
          path: bibai-android-app/app/build/outputs/apk/debug/*.apk
